[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pypdf>=6.9.2",
    "pypdf2>=3.0.1",
]

[project.scripts]
invoice-summarizer = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["/"]
